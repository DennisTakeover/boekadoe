services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lookalike
      POSTGRES_PASSWORD: lookalike
      POSTGRES_DB: lookalike
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://lookalike:lookalike@db:5432/lookalike
    volumes:
      - ig_session:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
  ig_session:
